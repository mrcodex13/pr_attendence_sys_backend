services:
  - type: web
    name: pr-smart-attendance-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: DEVICE_SECRET_ENCRYPTION_KEY
        sync: false
      - key: FACE_TEMPLATE_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_URL
        sync: false
